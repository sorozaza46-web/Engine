name: Build Sheet Onion EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # GitHub paneli üzerinden manuel tetikleme için

jobs:
  build:
    runs-on: windows-latest # Windows API bağımlılıkları için şart

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # PyInstaller ve Windows entegrasyonu için gereken temel paketler
        pip install pywin32 pyinstaller
        # Projenin canlı disassembler motoru için gereken Capstone kütüphanesi
        pip install capstone

    - name: Build EXE with PyInstaller
      run: |
        # --onefile: Tek bir exe üretir
        # --noconsole: Arka planda siyah CMD ekranı açılmasını engeller
        # --paths=.: Yerel modüllerin (scanner, proclist, winmem) bulunmasını sağlar
        # --name: Çıktı dosyasının adını "SheetOnion" olarak netleştirir
        pyinstaller --onefile --noconsole --paths=. --name=SheetOnion app.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SheetOnion-Windows-EXE
        path: dist/SheetOnion.exe
        retention-days: 5 # Oluşan dosya GitHub üzerinde 5 gün boyunca saklanır
        
