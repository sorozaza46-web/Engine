name: Build Sheet Onion EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Manuel tetikleme için

jobs:
  build:
    runs-on: windows-latest # Windows API bağımlılıkları için gerekli

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Gerekli bağımlılıkları yüklüyoruz
        pip install pywin32 pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        # --onefile: Tek bir exe üretir
        # --noconsole: Arka planda terminal açılmasını engeller
        # --paths=.: Modül yollarını bulması için kök dizini dahil eder
        pyinstaller --onefile --noconsole --paths=. app.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SheetOnion-Windows-EXE
        path: dist/app.exe
        retention-days: 5 # Dosya 5 gün GitHub'da saklanır
        
